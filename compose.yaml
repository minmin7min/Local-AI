services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: private_company_ai
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d private_company_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://app:local-development-only@db:5432/private_company_ai
      SESSION_SECRET: local-compose-placeholder-change-before-use
      STORAGE_ROOT: /app/storage
      AI_PROVIDER: deterministic
      AI_MODEL: deterministic-v1
      MAX_UPLOAD_BYTES: 10485760
      SESSION_TTL_SECONDS: 28800
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["object-storage:/app/storage"]
volumes:
  postgres-data:
  object-storage:
