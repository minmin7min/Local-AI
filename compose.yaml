services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: private_company_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d private_company_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    depends_on:
      db: {condition: service_healthy}
    command: ["node", "dist/scripts/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:local-admin-development-only@db:5432/private_company_ai
      SESSION_SECRET: local-compose-placeholder-change-before-use
      STORAGE_ROOT: /app/storage

  app:
    build: .
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://pcai_runtime:local-runtime-development-only@db:5432/private_company_ai
      SESSION_SECRET: local-compose-placeholder-change-before-use
      STORAGE_ROOT: /app/storage
      AI_PROVIDER: deterministic
      AI_MODEL: deterministic-v1
      MAX_UPLOAD_BYTES: 10485760
      SESSION_TTL_SECONDS: 28800
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["object-storage:/app/storage"]
  worker-northstar:
    build: .
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ["node", "dist/scripts/worker.js", "10000000-0000-4000-8000-000000000001", "--loop"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pcai_runtime:local-runtime-development-only@db:5432/private_company_ai
      SESSION_SECRET: local-compose-placeholder-change-before-use
      STORAGE_ROOT: /app/storage
    volumes: ["object-storage:/app/storage"]
  worker-cedar:
    build: .
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ["node", "dist/scripts/worker.js", "20000000-0000-4000-8000-000000000001", "--loop"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pcai_runtime:local-runtime-development-only@db:5432/private_company_ai
      SESSION_SECRET: local-compose-placeholder-change-before-use
      STORAGE_ROOT: /app/storage
    volumes: ["object-storage:/app/storage"]
volumes:
  postgres-data:
  object-storage:
