name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres-test-only@127.0.0.1:5432/private_company_ai_test
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres-test-only@127.0.0.1:5432/private_company_ai_test
      TEST_DATABASE_URL: postgresql://pcai_runtime:runtime-test-only@127.0.0.1:5432/private_company_ai_test
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      STORAGE_ROOT: ./tmp/ci-storage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Start runner PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres-test-only'"
          sudo -u postgres createdb private_company_ai_test
      - run: npm ci
      - run: npm run db:test:setup
      - run: npm run db:migrate
      - run: npm run db:seed
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run test:integration
      - run: npm run build
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: npm run test:e2e
      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Enforce high-severity production dependency audit
        run: |
          set +e
          audit_output=$(npm audit --package-lock-only --omit=dev --audit-level=high 2>&1)
          audit_status=$?
          set -e
          printf '%s\n' "$audit_output"
          if [ "$audit_status" -eq 0 ]; then
            echo "Production dependency advisory check passed."
          elif printf '%s\n' "$audit_output" | grep -Eqi 'audit endpoint returned an error|ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|network request'; then
            echo "::warning::The npm advisory service is unavailable. Dependabot remains enabled; retry this check before production release."
          else
            echo "::error::High-severity production dependency findings must be resolved before release."
            exit "$audit_status"
          fi
