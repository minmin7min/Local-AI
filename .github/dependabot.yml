version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8 currently supports TypeScript versions below 6.1.
      # Keep compatible TypeScript updates enabled while blocking newer releases.
      - dependency-name: typescript
        versions:
          - ">=6.1.0"
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
